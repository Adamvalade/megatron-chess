<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Megatron Chess</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="chess.min.js"></script>
    <script src="chessboard.js"></script>
    <link rel="stylesheet" href="chessboard.css" />
    <link rel="stylesheet" href="site.css" />
    <link rel="preload" as="image" href="chesspieces/pieces/wP.png" />
    <link rel="preload" as="image" href="chesspieces/pieces/wR.png" />
    <link rel="preload" as="image" href="chesspieces/pieces/wN.png" />
    <link rel="preload" as="image" href="chesspieces/pieces/wB.png" />
    <link rel="preload" as="image" href="chesspieces/pieces/wQ.png" />
    <link rel="preload" as="image" href="chesspieces/pieces/wK.png" />
    <link rel="preload" as="image" href="chesspieces/pieces/bP.png" />
    <link rel="preload" as="image" href="chesspieces/pieces/bR.png" />
    <link rel="preload" as="image" href="chesspieces/pieces/bN.png" />
    <link rel="preload" as="image" href="chesspieces/pieces/bB.png" />
    <link rel="preload" as="image" href="chesspieces/pieces/bQ.png" />
    <link rel="preload" as="image" href="chesspieces/pieces/bK.png" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <p class="eyebrow">C++ Chess Engine</p>
        <h1>Megatron</h1>
        <p class="tagline">
          Play against a UCI chess engine built by Adam Valade.
        </p>
      </header>

      <main class="layout">
        <section class="board-panel">
          <div id="board"></div>
          <div id="status" class="status">White to move</div>
          <div id="thinking" class="thinking" hidden>Megatron is thinking…</div>
          <div id="error" class="error" hidden></div>
        </section>

        <aside class="side-panel">
          <div class="card">
            <h2>Game</h2>
            <label class="field">
              <span>Megatron plays</span>
              <select id="sideSelect">
                <option value="black" selected>Black</option>
                <option value="white">White</option>
              </select>
            </label>
            <label class="field">
              <span>Difficulty (search depth)</span>
              <select id="depthSelect">
                <option value="2">2 — Fast</option>
                <option value="3">3 — Easy</option>
                <option value="4" selected>4 — Standard</option>
                <option value="5">5 — Stronger</option>
                <option value="6">6 — Slow</option>
              </select>
            </label>
            <button id="resetButton" type="button">New Game</button>
          </div>

          <div class="card">
            <h2>Moves</h2>
            <ol id="moves-list" class="moves-list"></ol>
          </div>
        </aside>
      </main>
    </div>

    <div id="game-over" class="game-over" hidden>
      <div class="game-over-card">
        <h2 id="game-over-title">Game Over</h2>
        <p id="game-over-message"></p>
        <button id="gameOverReset" type="button">Play Again</button>
      </div>
    </div>

    <div id="promotion-modal" class="promotion-menu" hidden></div>
    <script src="app.js"></script>
  </body>
</html>
